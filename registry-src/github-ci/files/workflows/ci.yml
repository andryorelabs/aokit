name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --if-present typecheck

      - name: Lint
        run: bun run --if-present lint

      - name: Format check
        run: bun run --if-present format:check

      - name: Test
        run: bun run --if-present test

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Find the commitlint configuration
        id: config
        run: |
          if compgen -G 'commitlint.config.*' > /dev/null || compgen -G '.commitlintrc*' > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commitlint configuration in this Project; nothing to lint."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.config.outputs.found == 'true'
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.config.outputs.found == 'true'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        if: steps.config.outputs.found == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate commit messages
        if: steps.config.outputs.found == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  ci-passed:
    name: CI passed
    if: always()
    needs: [check, commitlint]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
        run: |
          echo "check=$CHECK_RESULT commitlint=$COMMITLINT_RESULT"
          [ "$CHECK_RESULT" = success ] || exit 1
          case "$COMMITLINT_RESULT" in success | skipped) ;; *) exit 1 ;; esac
