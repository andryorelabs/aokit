name: Docker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "registry-src/docker/**"
      - "registry-src/hono/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: ${{ matrix.layout }} oxc,hono,docker
    strategy:
      fail-fast: false
      matrix:
        layout: [single, monorepo]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create, docker build, run and request over HTTP
        env:
          LAYOUT: ${{ matrix.layout }}
        run: bun tools/docker-smoke/main.ts --layout "$LAYOUT"
