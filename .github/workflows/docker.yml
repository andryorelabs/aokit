name: Docker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "registry-src/docker/**"
      - "registry-src/hono/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.layout }} oxc,hono,docker
    strategy:
      fail-fast: false
      matrix:
        layout: [single, monorepo]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create, docker build, run and request over HTTP
        env:
          LAYOUT: ${{ matrix.layout }}
        run: bun tools/docker-smoke/main.ts --layout "$LAYOUT"
