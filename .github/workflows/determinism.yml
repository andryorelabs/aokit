name: Determinism

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest:
    name: digest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compute digest
        env:
          AOKIT_DIGEST_FILE: ${{ runner.temp }}/digest.txt
        run: bun test packages/aokit/test/pipeline/digest.test.ts

      - name: Compute matrix digest
        env:
          AOKIT_MATRIX_DIGEST_FILE: ${{ runner.temp }}/matrix.txt
        run: bun test packages/aokit/test/matrix/matrix.test.ts

      - name: Print digests
        run: |
          cat "$RUNNER_TEMP/digest.txt"
          cat "$RUNNER_TEMP/matrix.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/digest.txt
            ${{ runner.temp }}/matrix.txt

  compare:
    name: compare digests
    needs: digest
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: digests

      - name: Compare Linux and macOS
        run: |
          echo "linux:"
          cat digests/digest-ubuntu-latest/digest.txt
          echo "macos:"
          cat digests/digest-macos-latest/digest.txt
          diff digests/digest-ubuntu-latest/digest.txt digests/digest-macos-latest/digest.txt

      - name: Compare matrix Linux and macOS
        run: |
          echo "linux:"
          cat digests/digest-ubuntu-latest/matrix.txt
          echo "macos:"
          cat digests/digest-macos-latest/matrix.txt
          diff digests/digest-ubuntu-latest/matrix.txt digests/digest-macos-latest/matrix.txt
