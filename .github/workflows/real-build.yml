name: Real build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.layout }} ${{ matrix.modules }}
    strategy:
      fail-fast: false
      matrix:
        layout: [single, monorepo]
        modules:
          - oxc,knip,vite-react,tailwind4
          - oxc,hono,docker,coolify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Create, install, build and typecheck
        run: bun tools/real-build/main.ts --layout "${{ matrix.layout }}" --modules "${{ matrix.modules }}"
