name: Distribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: package and binary (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build:package

      - name: Lint package
        run: bun run lint:package

      - name: Build binary
        run: bun run build:binary -- --target bun-linux-x64

      - name: Pack tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          (cd packages/aokit && bun pm pack --destination "$RUNNER_TEMP/tarballs")
          (cd packages/create-aokit && bun pm pack --destination "$RUNNER_TEMP/tarballs")
          ls "$RUNNER_TEMP/tarballs"

      - name: Process tests against the binary
        env:
          AOKIT_BIN: ${{ github.workspace }}/dist/bin/aokit-linux-x64
        run: bun test packages/aokit/test

      - name: Installed tarball tests
        run: |
          AOKIT_DIST_TARBALLS="$(printf '%s,' "$RUNNER_TEMP"/tarballs/*.tgz)" \
            bun test packages/aokit/test/dist/package

      - name: End-to-end and digest comparison
        run: |
          AOKIT_BIN="$GITHUB_WORKSPACE/dist/bin/aokit-linux-x64" \
          AOKIT_DIST_TARBALLS="$(printf '%s,' "$RUNNER_TEMP"/tarballs/*.tgz)" \
            bun test packages/aokit/test/dist/e2e

  arm64:
    name: package and binary (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-arm64
            artifact: aokit-linux-arm64
            runner: ubuntu-24.04-arm
          - target: bun-darwin-arm64
            artifact: aokit-darwin-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build:package

      - name: Lint package
        run: bun run lint:package

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
        run: bun run build:binary -- --target "$TARGET"

      - name: Pack tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/tarballs"
          (cd packages/aokit && bun pm pack --destination "$RUNNER_TEMP/tarballs")
          (cd packages/create-aokit && bun pm pack --destination "$RUNNER_TEMP/tarballs")
          ls "$RUNNER_TEMP/tarballs"

      - name: Process tests against the binary
        env:
          AOKIT_BIN: ${{ github.workspace }}/dist/bin/${{ matrix.artifact }}
        run: bun test packages/aokit/test

      - name: Installed tarball tests
        run: |
          AOKIT_DIST_TARBALLS="$(printf '%s,' "$RUNNER_TEMP"/tarballs/*.tgz)" \
            bun test packages/aokit/test/dist/package

      - name: End-to-end and digest comparison
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          AOKIT_BIN="$GITHUB_WORKSPACE/dist/bin/$ARTIFACT" \
          AOKIT_DIST_TARBALLS="$(printf '%s,' "$RUNNER_TEMP"/tarballs/*.tgz)" \
            bun test packages/aokit/test/dist/e2e
