name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every job and `npm publish --dry-run`; publish nothing. A real publish also needs a v* tag ref.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      dry-run: ${{ steps.release.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Resolve version, dist-tag and dry-run
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          version="$(jq -r .version packages/aokit/package.json)"
          create_version="$(jq -r .version packages/create-aokit/package.json)"
          create_dependency="$(jq -r .dependencies.aokit packages/create-aokit/package.json)"
          module_version="$(jq -r .version packages/module/package.json)"
          if [ "$create_version" != "$version" ] || [ "$create_dependency" != "$version" ]; then
            echo "::error::create-aokit $create_version (aokit dependency $create_dependency) must match aokit $version"
            exit 1
          fi
          if [ "$module_version" != "$version" ]; then
            echo "::error::@aokit/module $module_version must match aokit $version"
            exit 1
          fi
          case "${version%%+*}" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          dry_run=true
          if [ "$REF_TYPE" = tag ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match the package version v$version"
              exit 1
            fi
            if [ "$EVENT_NAME" = push ] || [ "$INPUT_DRY_RUN" = false ]; then
              dry_run=false
            fi
          fi
          {
            echo "version=$version"
            echo "dist-tag=$dist_tag"
            echo "dry-run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "@aokit/module, aokit and create-aokit $version, dist-tag $dist_tag, dry-run $dry_run"

      - name: Tag is on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "No tag: a dry run from $REF_NAME is not checked against main."
            exit 0
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
            echo "::error::tag $REF_NAME ($TAG_SHA) is not on main; a release is tagged on a commit of main"
            exit 1
          fi
          echo "tag $REF_NAME ($TAG_SHA) is on main"

      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "No tag: a dry run from $REF_NAME does not need a green CI."
            exit 0
          fi
          conclusions="$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits/$TAG_SHA/check-runs" \
            -f "check_name=CI passed" -f filter=latest \
            --jq '.check_runs | map(.conclusion // "pending") | unique | join(",")')"
          if [ "$conclusions" != success ]; then
            echo "::error::\"CI passed\" is ${conclusions:-missing} for $TAG_SHA; tag $REF_NAME is released once it is green"
            exit 1
          fi
          echo "\"CI passed\" is green for $TAG_SHA"

      - name: Release notes from CHANGELOG.md
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            bun tools/release/main.ts "$VERSION" "$RUNNER_TEMP/release/release-notes.md"
          else
            bun tools/release/main.ts "$VERSION" "$RUNNER_TEMP/release/release-notes.md" --allow-missing
          fi

      - name: Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build package
        run: bun run build:package

      - name: Lint package
        run: bun run lint:package

      - name: Pack tarballs
        run: |
          mkdir -p "$RUNNER_TEMP/release/tarballs"
          (cd packages/aokit && bun pm pack --destination "$RUNNER_TEMP/release/tarballs")
          (cd packages/create-aokit && bun pm pack --destination "$RUNNER_TEMP/release/tarballs")
          mkdir -p "$RUNNER_TEMP/release/module"
          (cd packages/module/dist && bun pm pack --destination "$RUNNER_TEMP/release/module")
          ls "$RUNNER_TEMP/release/tarballs" "$RUNNER_TEMP/release/module"

      - name: Installed tarball tests
        run: |
          AOKIT_DIST_TARBALLS="$(printf '%s,' "$RUNNER_TEMP"/release/tarballs/*.tgz)" \
            bun test packages/aokit/test/dist/package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: binary (${{ matrix.artifact }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: bun-linux-x64
            artifact: aokit-linux-x64
            runner: ubuntu-latest
            tested: true
          - target: bun-linux-arm64
            artifact: aokit-linux-arm64
            runner: ubuntu-24.04-arm
            tested: true
          - target: bun-darwin-arm64
            artifact: aokit-darwin-arm64
            runner: macos-latest
            tested: true
          - target: bun-darwin-x64
            artifact: aokit-darwin-x64
            runner: macos-15-intel
            tested: true
          - target: bun-windows-x64
            artifact: aokit-windows-x64.exe
            runner: windows-latest
            tested: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings on checkout
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build binary
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          bun run build:binary -- --target "$TARGET"
          if [ ! -f "dist/bin/$ARTIFACT" ]; then
            echo "::error::build:binary for $TARGET did not write dist/bin/$ARTIFACT"
            exit 1
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: matrix.tested
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Process tests against the binary
        if: matrix.tested
        env:
          AOKIT_BIN: ${{ github.workspace }}/dist/bin/${{ matrix.artifact }}
        run: bun test packages/aokit/test

      - name: End-to-end and digest comparison
        if: matrix.tested
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          workspace="${GITHUB_WORKSPACE//\\//}"
          runner_temp="${RUNNER_TEMP//\\//}"
          AOKIT_BIN="$workspace/dist/bin/$ARTIFACT" \
          AOKIT_DIST_TARBALLS="$(printf '%s,' "$runner_temp"/release/tarballs/*.tgz)" \
            bun test packages/aokit/test/dist/e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/bin/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: checksums, attestations and GitHub Release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: aokit-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Write SHA256SUMS
        env:
          ASSETS_DIR: ${{ runner.temp }}/assets
        run: |
          cd "$ASSETS_DIR"
          expected="aokit-darwin-arm64 aokit-darwin-x64 aokit-linux-arm64 aokit-linux-x64 aokit-windows-x64.exe"
          found="$(shopt -s dotglob nullglob; printf '%s\n' * | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$found" != "$expected " ]; then
            echo "::error::expected exactly the binaries $expected, found $found"
            exit 1
          fi
          read -ra binaries <<< "$expected"
          sha256sum -- "${binaries[@]}" | LC_ALL=C sort -k 2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.verify.outputs.dry-run == 'false'
        with:
          subject-checksums: ${{ runner.temp }}/assets/SHA256SUMS

      - name: Add verification steps to the release notes
        env:
          NOTES_FILE: ${{ runner.temp }}/release/release-notes.md
          REPOSITORY: ${{ github.repository }}
        run: |
          cat >> "$NOTES_FILE" <<NOTES

          ## Verify the binaries

          Download the binaries you need and \`SHA256SUMS\` into one directory, then check the checksums and the build provenance attestation:

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          gh attestation verify aokit-linux-x64 --repo $REPOSITORY
          \`\`\`

          On macOS, run \`shasum -a 256 -c SHA256SUMS --ignore-missing\` instead of \`sha256sum\`. Mark the binary executable with \`chmod +x\` before running it.

          Every binary passed the process and end-to-end tests on a native runner: linux-x64, linux-arm64, darwin-arm64, darwin-x64 (Intel macOS) and windows-x64.
          NOTES

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
          ASSETS_DIR: ${{ runner.temp }}/assets
          NOTES_FILE: ${{ runner.temp }}/release/release-notes.md
        run: |
          release_flags=(--repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file "$NOTES_FILE" --verify-tag)
          if [ "$DIST_TAG" != latest ]; then
            release_flags+=(--prerelease)
          fi
          if [ "$DRY_RUN" != false ]; then
            echo "Dry run: the GitHub Release v$VERSION is not created; the assets are uploaded as a workflow artifact."
            exit 0
          fi
          gh release create "v$VERSION" "$ASSETS_DIR"/aokit-* "$ASSETS_DIR/SHA256SUMS" "${release_flags[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            ${{ runner.temp }}/assets
            ${{ runner.temp }}/release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: [verify, binaries, release]
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Check npm supports trusted publishing
        run: |
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current is older than $required, the first version with trusted publishing"
            exit 1
          fi

      - name: Publish @aokit/module, aokit, then create-aokit
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          DRY_RUN: ${{ needs.verify.outputs.dry-run }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          publish_flags=(--provenance --access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" != false ]; then
            publish_flags+=(--dry-run)
          fi
          publish_package() {
            local name="$1" tarball="$2"
            if [ "$DRY_RUN" = false ] && [ -n "$(npm view "$name@$VERSION" version 2>/dev/null)" ]; then
              echo "$name@$VERSION is already on npm, skipping"
              return 0
            fi
            npm publish "$tarball" "${publish_flags[@]}"
          }
          publish_package @aokit/module "$RELEASE_DIR/module/aokit-module-$VERSION.tgz"
          for package in aokit create-aokit; do
            publish_package "$package" "$RELEASE_DIR/tarballs/$package-$VERSION.tgz"
          done

  smoke:
    name: smoke test the npm release
    needs: [verify, publish]
    if: needs.verify.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Check the npm dist-tags
        env:
          RETRY_SECONDS: 15
        run: |
          for package in @aokit/module aokit create-aokit; do
            published=""
            for attempt in 1 2 3 4 5 6 7 8; do
              published="$(npm view "$package" "dist-tags.$DIST_TAG" || true)"
              if [ "$published" = "$VERSION" ]; then
                break
              fi
              if [ "$attempt" -lt 8 ]; then
                sleep "$RETRY_SECONDS"
              fi
            done
            if [ "$published" != "$VERSION" ]; then
              echo "::error::npm dist-tag $DIST_TAG of $package is ${published:-missing}, expected $VERSION"
              exit 1
            fi
            echo "$package@$DIST_TAG is $VERSION"
          done

      - name: Run aokit and create-aokit from npm
        run: |
          workdir="$(mktemp -d "$RUNNER_TEMP/smoke-run.XXXXXX")"
          cd "$workdir"
          printed="$(bunx "aokit@$VERSION" --version)"
          if [ "$printed" != "$VERSION" ]; then
            echo "::error::bunx aokit@$VERSION --version printed $printed"
            exit 1
          fi
          bunx "create-aokit@$VERSION" smoke --yes --modules oxc
