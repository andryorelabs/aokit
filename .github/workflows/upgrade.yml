name: Upgrade

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "registry/**"
      - "registry-src/**"
      - "packages/aokit/src/merge/**"
      - "packages/aokit/src/merger/**"
      - "packages/aokit/src/lifecycle/**"
      - "packages/aokit/src/update/**"
      - "tools/upgrade-job/**"
      - ".github/workflows/upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade every curated selection on both Layouts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Upgrade each Release pair
        run: bun tools/upgrade-job/main.ts
