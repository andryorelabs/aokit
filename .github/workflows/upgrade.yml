name: Upgrade

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "registry/**"
      - "registry-src/**"
      - "packages/aokit/src/merge/**"
      - "packages/aokit/src/merger/**"
      - "packages/aokit/src/lifecycle/**"
      - "packages/aokit/src/update/**"
      - "tools/upgrade-job/**"
      - ".github/workflows/upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade every curated selection on both Layouts
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.BLACKSMITH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Upgrade each Release pair
        run: bun tools/upgrade-job/main.ts
