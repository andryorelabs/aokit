name: Documentation
description: Something in the docs, the README or a guide is missing, unclear or wrong.
title: "docs: "
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first to avoid duplicates.
  - type: input
    id: location
    attributes:
      label: Page or file
      description: A link or a path to the documentation that needs work.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Registry
        - Module
        - Generated Project output
        - Other
    validations:
      required: true
