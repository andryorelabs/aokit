name: Enhancement
description: Improve something that already works, such as a flag, a message, a default or a Module.
title: "enhance: "
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first to avoid duplicates. For something that does not exist yet, use the feature request form.
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What works today and what could be better.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Registry
        - Module
        - Generated Project output
        - Other
    validations:
      required: true
